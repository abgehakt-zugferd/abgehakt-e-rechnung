# Kein leeres Issue: die Vorlagen fragen nach Dingen, die sonst in der ersten
# Rückfrage nachgereicht werden müssten (Version, Schritte, Kritikalität).
# Der Betreuer selbst umgeht das weiterhin über `gh issue create`.
#
# Bewusst KEINE Vorlage für `Feature` und `Roadmap`: beide sind Entscheidungen
# des Projekts, keine Eingaben von außen. Ein Wunsch, der gleich als Feature
# angelegt werden könnte, würde genau die Unterscheidung aufheben, für die es
# die drei Labels gibt.
