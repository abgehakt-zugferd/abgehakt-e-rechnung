# Datenwache (Issues und Pull Requests): prueft neue und bearbeitete Issues,
# Kommentare, PR-Titel, PR-Beschreibungen, Reviews und Review-Kommentare auf
# Muster echter Daten (#49, #154). In Issues und Pull Requests gehoeren nur
# erfundene Testdaten.
#
# Bekannte Grenze: Reviews und Review-Kommentare aus Forks laufen ohne Secret
# und mit nur lesendem Token. Dort greifen nur die eingebauten Muster, und ein
# Treffer kann weder Label noch Kommentar setzen: der Lauf endet rot, das ist
# dann das Signal.
#
# Zusatzmuster (Klarnamen, eigene Nummernkreise) NIE hier eintragen. Sie kommen
# aus dem Actions-Secret ECHTDATEN_MUSTER (eine Regex je Zeile, '#' als Kommentar).
#
# Bei Fund: Label 'echtdaten-verdacht' + Hinweiskommentar. Der Kommentar nennt
# nur die Musterklasse, nie den Treffertext.

name: datenwache-issues

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # Bei pull_request_target checkt das den Basis-Branch aus, nie den
      # PR-Code; ein ref auf den PR-Kopf waere eine Sicherheitsluecke,
      # weil das Secret anliegt.
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ZUSATZ_MUSTER: ${{ secrets.ECHTDATEN_MUSTER }}
        with:
          script: |
            const { pruefeEreignis } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/datenwache-texte.js');
            const { nummer, klassen } = pruefeEreignis(context.payload, process.env.ZUSATZ_MUSTER || '');
            if (klassen.length === 0) return;
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: 'echtdaten-verdacht', color: 'b60205',
                description: 'Datenwache: Muster echter Daten gefunden',
              });
            } catch (e) { /* Label existiert schon */ }
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: nummer, labels: ['echtdaten-verdacht'],
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: nummer,
              body: 'Datenwache: Dieser Eintrag enthaelt Text im Format echter Daten '
                + '(Musterklasse: ' + klassen.join(', ') + '). In Issues und Pull '
                + 'Requests gehoeren nur erfundene Testdaten. Bitte bereinigen - und '
                + 'beachten: der Bearbeitungsverlauf bleibt auf GitHub sichtbar; bei '
                + 'echten Daten den Verlauf loeschen (Issue-Menue) oder den '
                + 'GitHub-Support bitten.',
            });
